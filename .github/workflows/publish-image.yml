name: publish arkcompiler-test image
on:
  workflow_dispatch:
    inputs:
      tools_release:
        description: GitHub Release tag containing arkcompiler-test-tools.tar.zst
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tools_release || github.event.release.tag_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/arkcompiler-test
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned ArkCompiler tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .stage /tmp/tools
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'arkcompiler-test-tools.tar.zst' --dir /tmp/tools
          tar --zstd -xf /tmp/tools/arkcompiler-test-tools.tar.zst -C .stage
          test -x .stage/bin/es2abc
          test -x .stage/bin/ark_disasm
          test -x .stage/bin/ark_js_vm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
